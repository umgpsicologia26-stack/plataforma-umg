# Candidato de prueba: Apache existente como proxy hacia Laravel Reverb.
# Apache conserva el puerto público 8080; Reverb escucha solo en loopback.
# Requiere mod_proxy y soporte WebSocket (mod_proxy_wstunnel o Apache >= 2.4.47).

ProxyPreserveHost On

# /apps debe declararse antes de /app para evitar coincidencia por prefijo.
ProxyPass        "/apps" "http://127.0.0.1:6001/apps"
ProxyPassReverse "/apps" "http://127.0.0.1:6001/apps"

ProxyPass        "/app" "ws://127.0.0.1:6001/app" upgrade=websocket
ProxyPassReverse "/app" "ws://127.0.0.1:6001/app"
