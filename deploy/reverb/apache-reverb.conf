# PRUEBA AISLADA: proxy de Laravel Reverb detrás del Apache existente.
# No aplicar en producción sin validar primero la versión de Apache y el arranque
# supervisado de ambos procesos dentro del contenedor de DigitalOcean.
#
# Reverb debe escuchar únicamente en 127.0.0.1:6001.
# Apache conserva el puerto público 8080.
#
# Requiere mod_proxy y soporte WebSocket (mod_proxy_wstunnel o mod_proxy_http
# con Apache >= 2.4.47).

ProxyPreserveHost On

# Endpoint WebSocket de Reverb (Laravel Echo / Pusher protocol).
ProxyPass        "/app" "ws://127.0.0.1:6001/app" upgrade=websocket
ProxyPassReverse "/app" "ws://127.0.0.1:6001/app"

# Endpoint HTTP de la API de Reverb.
ProxyPass        "/apps" "http://127.0.0.1:6001/apps"
ProxyPassReverse "/apps" "http://127.0.0.1:6001/apps"
